services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: bank_test
      MYSQL_USER: bank_test
      MYSQL_PASSWORD: test_password
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP
          --host=127.0.0.1
          --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          --execute="SELECT 1"
          >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: mlflow server --host 0.0.0.0 --port 8080 --allowed-hosts *
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen( 'http://127.0.0.1:8080/', timeout=3 )
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 20s